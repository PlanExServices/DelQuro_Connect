name: iOS native validation

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-native-validation.yml'

permissions:
  contents: read

concurrency:
  group: ios-native-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      CONNECT_REQUIRE_HTTPS: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CONNECT_URL: 'https://staff-connect.example.invalid'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install and check dependencies
        run: |
          node --version
          xcodebuild -version
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Generate the native project and install CocoaPods
        run: |
          npx --no-install expo prebuild --platform ios --no-install
          pod install --project-directory=ios

      - name: Compile and inspect an unsigned release archive
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          scheme="$(basename "$workspace" .xcworkspace)"
          archive="$RUNNER_TEMP/DelQuroConnect.xcarchive"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO archive -quiet
          app="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print DTSDKName' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$app/Info.plist"
          manifest_count=0
          while IFS= read -r -d '' manifest; do
            plutil -lint "$manifest"
            manifest_count=$((manifest_count + 1))
          done < <(find "$app" -name PrivacyInfo.xcprivacy -print0)
          test "$manifest_count" -gt 0
